name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows가 주 운영 환경이지만 Dockerfile/compose로 Linux에서도 돌리므로 둘 다 검증한다.
    # (watcher의 경로 정규화는 OS별 구분자 차이를 타므로 windows-latest가 실질적인 게이트)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]  # pyproject requires-python >=3.11

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q
