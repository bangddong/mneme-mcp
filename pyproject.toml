[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mneme-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "watchdog>=4.0.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mneme = "mneme.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mneme"]
