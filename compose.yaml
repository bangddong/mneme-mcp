# mneme + 로컬 LLM(Ollama) 한 방 기동:  docker compose up -d
# 위키 경로는 WIKI_HOST_DIR 환경변수로 지정 (기본: repo 안 placeholder ./wiki)
services:
  mneme:
    build: .
    ports:
      - "8080:8080"
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - mneme-data:/data
      - ${WIKI_HOST_DIR:-./wiki}:/wiki
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  mneme-data:
  ollama-models:
